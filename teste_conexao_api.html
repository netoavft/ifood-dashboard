<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Teste de conexão — API Supabase</title>
<style>
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #111110; color: #fff; padding: 30px; }
  h1 { color: #c8102e; font-weight: 800; }
  .card { background: #1a1a19; border: 1px solid #34332f; border-radius: 14px; padding: 16px 20px; margin-bottom: 12px; }
  .lbl { color: #8a897e; font-size: 12px; text-transform: uppercase; }
  .val { font-size: 22px; font-weight: 800; color: #fff; }
  .erro { color: #ff6b6b; }
  table { border-collapse: collapse; margin-top: 10px; width: 100%; }
  th, td { border: 1px solid #34332f; padding: 6px 10px; text-align: left; font-size: 13px; }
  th { background: #232321; color: #a5a49a; }
</style>
</head>
<body>

<h1>Teste de conexão — Supabase</h1>

<!-- Esta página lê com a chave anonima. Em 21/08/2026 o papel `anon` perdeu o
     SELECT no banco (script/fechar_leitura_anonima.sql), então daqui em diante
     ela responde "permission denied" — e isso é o comportamento CERTO, nao
     conexao quebrada. Quem quiser testar leitura tem de mandar o token de um
     usuario logado, como o painel faz. -->
<div class="card" style="border-color:#e8b04b;">
  <div class="lbl">aviso</div>
  <div>Desde 21/08/2026 a leitura anônima está fechada. Os testes abaixo vão
      responder <strong>permission denied</strong> — é o esperado. Para ler o banco
      é preciso estar logado, e aí o lugar é o próprio painel.</div>
</div>
<div id="status">Consultando...</div>
<div id="resultado"></div>

<script>
  // Estas duas informações são públicas por design (chave "anon" com RLS
  // limitando a somente-leitura) — podem ficar visíveis no HTML.
  const SUPABASE_URL = "https://rtmgzsikwglsvpopbfbw.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0bWd6c2lrd2dsc3Zwb3BiZmJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NDgwMjcsImV4cCI6MjEwMTQyNDAyN30.-vwbQkcuAbbonmBVCeUWXjTg54uB5MNN94QmMlBxTA4";

  async function consultarSupabase(caminho) {
    const resp = await fetch(`${SUPABASE_URL}/rest/v1/${caminho}`, {
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      },
    });
    if (!resp.ok) throw new Error(`Erro ${resp.status}: ${await resp.text()}`);
    return resp.json();
  }

  async function main() {
    const statusEl = document.getElementById("status");
    const resultadoEl = document.getElementById("resultado");
    try {
      const lojas = await consultarSupabase("dim_lojas?select=nome_loja,unidade&order=nome_loja");

      // Resumo financeiro: já vem somado do banco (view vw_resumo_geral), sem limite de linhas.
      const [resumo] = await consultarSupabase("vw_resumo_geral?select=*");
      const totalPedidos = resumo.total_pedidos;
      const bruto = Number(resumo.bruto || 0);
      const liquido = Number(resumo.liquido || 0);
      const fmt = (v) => v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

      statusEl.innerHTML = "✅ Conectado ao Supabase com sucesso.";

      resultadoEl.innerHTML = `
        <div class="card"><div class="lbl">Pedidos (excl. cancelados)</div><div class="val">${totalPedidos}</div></div>
        <div class="card"><div class="lbl">Bruto</div><div class="val">R$ ${fmt(bruto)}</div></div>
        <div class="card"><div class="lbl">Líquido</div><div class="val">R$ ${fmt(liquido)}</div></div>
        <div class="card">
          <div class="lbl">Lojas cadastradas (${lojas.length})</div>
          <table>
            <tr><th>Loja</th><th>Unidade</th></tr>
            ${lojas.map(l => `<tr><td>${l.nome_loja}</td><td>${l.unidade}</td></tr>`).join("")}
          </table>
        </div>
      `;
    } catch (err) {
      statusEl.innerHTML = `<span class="erro">❌ Erro ao conectar: ${err.message}</span>`;
    }
  }

  main();
</script>
</body>
</html>
